<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ホバーで画像ズーム・オーバーレイ・ボタン表示を同時に出す</title>
    <meta name="description" content="" />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main>
      <h2>ホバーで画像ズーム・オーバーレイ・ボタン表示を同時に出す</h2>
      <section>
        <div class="card">
          <img
            class="card-image"
            src="https://picsum.photos/320/400"
            alt="ランダムなカード"
          />
          <div class="card-overlay">
            <button class="card-button" type="button">詳しく見る</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
